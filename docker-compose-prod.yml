services:
  app:
    build: ./app
    restart: unless-stopped
    expose:
      - 8000
    command: uvicorn --host 0.0.0.0 app:app
    networks:
      - back
    volumes:
      - ./app:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
  nginx:
    image: nginx
    restart: unless-stopped
    ports:
      - 80:80
      # - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # - ./nginx/cert.crt:/etc/nginx/conf.d/cert.crt
      # - ./nginx/private.key:/etc/nginx/conf.d/private.key
    networks:
      - back
      - default
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  back:
    driver: bridge
    enable_ipv6: false
    internal: true
